# App Engine configuration (alternative to Cloud Run)
runtime: python39
entrypoint: python app.py

env_variables:
  PORT: 8080

instance_class: F2
automatic_scaling:
  min_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.6
  target_memory_utilization: 0.6

handlers:
  - url: /static
    static_dir: static
    secure: optional
  
  - url: /.*
    script: auto
    secure: optional
