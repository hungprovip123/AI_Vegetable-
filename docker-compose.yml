version: '3.8'

services:
  veggie-ai:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./vegetable_classification:/app/vegetable_classification:ro
      - ./vegetable_dataset:/app/vegetable_dataset:ro
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
